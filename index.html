<script>
const lessons=[
{title:"第 1 關｜觀念村",story:"數學偵探你好！校慶前夕，展示櫃裡的「智慧之星獎盃」竟然不見了！現場只留下三張數字卡：24、18、12。先破解因數密碼，找出第一條線索！",sub:"因數、倍數、公因數、公倍數",body:"<h2>🌱 認識因數與倍數</h2><p><b>因數</b>：可以整除某個數的數。<br><b>倍數</b>：某個數乘以整數得到的數。</p><div class='example'><b>12 的因數：</b>1、2、3、4、6、12<br><b>18 的因數：</b>1、2、3、6、9、18<br><b>公因數：</b>1、2、3、6 → 最大公因數是 6<br><br><b>12 的倍數：</b>12、24、36……<br><b>18 的倍數：</b>18、36、54……<br><b>公倍數：</b>36、72…… → 最小公倍數是 36</div><div class='callout'>🪄 小口訣：因數是「除得盡」；倍數是「乘出來」。</div>",qs:[["24 的所有因數有哪些？",["1、2、3、4、6、8、12、24","1、2、4、6、12","2、3、4、6、8"],0,"24 可以被 1、2、3、4、6、8、12、24 整除。"],["8 的前 5 個正倍數是哪一組？",["8、16、24、32、40","8、16、24、32、40、48","1、2、4、8、16"],0,"8×1 到 8×5，依序是 8、16、24、32、40。"],["12 和 20 的公因數有哪些？",["1、2、4","1、2、3、4","2、4、6"],0,"12 和 20 都能被 1、2、4 整除。"]]},
{title:"第 2 關｜公因數森林",story:"第一張線索指出，獎盃可能被藏進一個需要平均分裝的箱子。現場有 18 枚徽章和 30 張貼紙，必須分成最多份、每份內容相同。解開最大公因數，才能取得箱子的暗號！",sub:"挑戰最大公因數",body:"<h2>🧩 最大公因數</h2><p>兩個或多個數的共同因數中，最大的一個就是最大公因數。</p><div class='callout'>看到「分成最多組」、「平均分配」、「每段一樣長且最長」，通常要想到最大公因數。</div><div class='example'><b>例：24 和 36</b><pre>2 │ 24　36<br>2 │ 12　18<br>3 │  6　 9<br>  │  2　 3</pre>共同除數相乘：2×2×3＝12，所以最大公因數是 12。</div>",qs:[["18 和 30 的最大公因數是多少？",["3","6","9"],1,"共同因數有 1、2、3、6，最大的是 6。"],["28 和 42 的最大公因數是多少？",["7","14","21"],1,"28=2×2×7；42=2×3×7，共同質因數相乘為 14。"],["24 顆糖和 32 顆餅乾平均分成最多份，最多幾份？",["4","8","12"],1,"平均分成最多份，求最大公因數 8。"]]},
{title:"第 3 關｜倍數城堡",story:"你找到一張神秘紙條：「每隔一段時間，警衛室的燈和走廊的鐘會同時閃亮。」兩種訊號分別有不同週期。算出它們再次重合的時間，才能趁機打開下一個線索櫃！",sub:"挑戰最小公倍數",body:"<h2>🚀 最小公倍數</h2><p>兩個或多個數的共同倍數中，最小的正整數就是最小公倍數。</p><div class='callout'>看到「同時」、「再次」、「週期」、「多久後又一起」，通常要想到最小公倍數。</div><div class='example'><b>例：12 和 18</b><pre>2 │ 12　18<br>3 │  6　 9<br>  │  2　 3</pre>把左邊除數和最後一列相乘：2×3×2×3＝36。</div>",qs:[["6 和 8 的最小公倍數是多少？",["12","24","48"],1,"共同倍數中最小的是 24。"],["9 和 12 的最小公倍數是多少？",["18","24","36"],2,"2×2×3×3＝36。"],["甲每 4 天澆花，乙每 6 天澆花，幾天後再次同一天澆花？",["10 天","12 天","24 天"],1,"週期重合，求最小公倍數 12 天。"]]},
{title:"第 4 關｜生活應用島",story:"目前有三位可能的目擊者：圖書股長、自然小老師和校刊編輯。線索藏在分組與週期問題裡。請判斷每個情境該用最大公因數還是最小公倍數，縮小調查範圍！",sub:"判斷使用哪一種方法",body:"<h2>🕵️ 看懂題目再出招</h2><div class='callout'><b>最大公因數：</b>分組、平分、剪成相同的最長長度。<br><b>最小公倍數：</b>週期、同時、再次相遇或重合。</div><h3>解題三步驟</h3><ol><li>圈出題目問什麼。</li><li>判斷是「分組」還是「週期重合」。</li><li>列式計算，寫上單位與答句。</li></ol>",qs:[["30 顆蘋果和 45 顆橘子分成內容相同且不剩的最多禮盒數，應求？",["最大公因數","最小公倍數"],0,"平均分組，求最大公因數。"],["甲車每 8 分鐘、乙車每 12 分鐘發車，同時發車後多久再次同時？",["最大公因數","最小公倍數"],1,"週期重合，求最小公倍數 24 分鐘。"],["48 公分和 60 公分緞帶剪成相同且最長的小段，每段幾公分？",["6 公分","12 公分","24 公分"],1,"等長切割且要最長，求最大公因數 12 公分。"]]},
{title:"第 5 關｜終極挑戰",story:"最後一份證物送到了！你已經掌握所有線索，但要確認獎盃的位置，必須解開五道混合謎題。仔細閱讀、選對方法，揭開校慶失竊案的真相！",sub:"混合題型總複習",body:"<h2>👑 終極挑戰！</h2><p>這一關不提示使用哪一種方法。先讀懂題目，再自己決定解法！</p><div class='callout'>考試檢查：我能分辨因數與倍數、使用短除法、判斷最大公因數或最小公倍數，並寫上單位。</div>",qs:[["36 和 48 的最大公因數是多少？",["6","12","18"],1,"最大公因數是 12。"],["10 和 15 的最小公倍數是多少？",["30","45","150"],0,"最小公倍數是 30。"],["紅燈每 6 秒亮一次，綠燈每 9 秒亮一次，同時亮後幾秒再次同時亮？",["3 秒","18 秒","54 秒"],1,"週期重合，求最小公倍數 18 秒。"],["40 顆糖和 56 顆餅乾平均分成最多份，最多幾份？",["4 份","8 份","16 份"],1,"平均分成最多份，求最大公因數 8。"],["16 和 24 的公因數中，最大的是多少？",["4","8","12"],1,"最大公因數是 8。"]]}
];

function makeQ(prompt,answer,distractors,why){
 const correct=String(answer),opts=[correct];
 for(const d of distractors.map(String)){if(!opts.includes(d))opts.push(d)}
 let bump=1;while(opts.length<4){const candidate=String(Number(correct)+bump++);if(!opts.includes(candidate))opts.push(candidate)}
 for(let i=opts.length-1;i>0;i--){const j=rand(0,i);[opts[i],opts[j]]=[opts[j],opts[i]]}
 return [prompt,opts,opts.indexOf(correct),why];
}
function makeQuestions(level){
 const pool=[];
 if(level===0){
  for(let i=0;i<24;i++){const n=rand(12,48),k=rand(2,8);
   if(i%3===0){const fs=Array.from({length:n},(_,j)=>j+1).filter(x=>n%x===0).join("、");pool.push(makeQ(n+" 的所有正因數是哪一組？",fs,[fs+"、"+(n+1),"1、"+n,"2、3、5"],"能整除 "+n+" 且沒有餘數的數，才是它的因數。"))}
   else if(i%3===1){const v=n*k;pool.push(makeQ(n+" 的第 "+k+" 個正倍數是多少？",v,[v+n,v-n,n+k],n+" × "+k+" ＝ "+v+"。"))}
   else{const a=rand(2,9),b=rand(2,9),x=a*n,y=b*n,g=gcd(x,y);pool.push(makeQ(x+" 和 "+y+" 的最大公因數是多少？",g,[g+1,g*2,Math.min(x,y)],"共同因數中最大的數是 "+g+"。"))}
  }
 }else if(level===1){
  for(let i=0;i<24;i++){const a=rand(2,12),b=rand(2,12),m=rand(2,5),x=a*m,y=b*m,g=gcd(x,y);pool.push(makeQ(x+" 和 "+y+" 的最大公因數是多少？",g,[g*2,g+2,Math.max(x,y)],"兩數共同因數中最大的數是 "+g+"。"))}
 }else if(level===2){
  for(let i=0;i<24;i++){const a=rand(2,12),b=rand(2,12),m=rand(2,5),x=a*m,y=b*m,v=lcm(x,y);pool.push(makeQ(x+" 和 "+y+" 的最小公倍數是多少？",v,[v+m,v*2,Math.max(x,y)],"最小共同倍數是 "+v+"。"))}
 }else if(level===3){
  for(let i=0;i<24;i++){const a=rand(3,12),b=rand(3,12);
   if(i%3===0){const x=a*2,y=b*2,v=gcd(x,y);pool.push(makeQ(x+" 顆紅球和 "+y+" 顆藍球分成內容相同且最多的幾組？",v,[v+2,lcm(x,y),a+b],"平均分成最多組，求最大公因數。"))}
   else if(i%3===1){const v=lcm(a,b);pool.push(makeQ("甲每 "+a+" 分鐘響一次，乙每 "+b+" 分鐘響一次，現在同時響，幾分鐘後再次同時響？",v,[gcd(a,b),v+a,v+b],"週期重合，求最小公倍數。"))}
   else{const x=a*6,y=b*6,v=gcd(x,y);pool.push(makeQ("長 "+x+" 公分和 "+y+" 公分的緞帶，剪成相同且最長的小段，每段幾公分？",v,[v*2,Math.abs(x-y),lcm(x,y)],"等長切割且要最長，求最大公因數。"))}
  }
 }else{
  for(let i=0;i<24;i++){const a=rand(3,12),b=rand(3,12),m=rand(2,4),x=a*m,y=b*m;
   if(i%2===0){const v=gcd(x,y);pool.push(makeQ(x+" 位同學和 "+y+" 張卡片平均分成最多份，最多幾份？",v,[lcm(x,y),v+m,Math.max(x,y)],"平均分配成最多份，求最大公因數。"))}
   else{const v=lcm(a,b);pool.push(makeQ("兩個提示燈分別每 "+a+" 秒和每 "+b+" 秒閃一次，同時閃後幾秒再次同時？",v,[gcd(a,b),v+a,v+b],"週期同時發生，求最小公倍數。"))}
  }
 }
 for(let i=pool.length-1;i>0;i--){const j=rand(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}
 return pool.slice(0,5);
}
const evidenceClues=[
 "證物 01：獎盃底座旁的星星貼紙，與校刊封面裝飾相同。",
 "證物 02：收納箱裡的金色緞帶，與校刊編輯桌上的佈置材料吻合。",
 "證物 03：值日紀錄顯示，下午 4:10 走廊燈號與廣播測試同時啟動。",

 "證物 05：海報筒內找到字條：「獎盃已移到驚喜展台，校慶時一起揭幕！」"
];
const suspects=[
 {name:"傅貝貝｜圖書股長",role:"負責圖書室與借還紀錄",emoji:"📚",desc:"當天下午在圖書室整理新書。"},

 {name:"阿花小天使｜校刊編輯",role:"負責校刊封面與驚喜展台",emoji:"📰",desc:"當天下午曾拿著海報筒前往活動中心。"}

function suspectBoard(){return '<div class="suspect-grid">'+suspects.map(s=>'<div class="suspect-card">'+portrait(s)+'<b>'+s.name+'</b><small>'+s.role+'</small><p>'+s.desc+'</p></div>').join("")+'</div>';}
let activeQuestions=[];

let state=JSON.parse(localStorage.getItem("mathQuest")||'{"done":[],"correct":0,"wrong":{},"stars":0,"badges":[],"rewarded":[]}');
if(!Array.isArray(state.evidence)){state={done:[],correct:0,wrong:{},stars:0,badges:[],rewarded:[],evidence:[],caseSolved:false}}
state.stars=state.stars||0;state.badges=state.badges||[];state.rewarded=state.rewarded||[];state.evidence=state.evidence||[];state.caseSolved=state.caseSolved||false;let current=0;
const nav=document.getElementById("nav"),content=document.getElementById("content");
function save(){localStorage.setItem("mathQuest",JSON.stringify(state));stats()}
function stats(){document.getElementById("suspects").innerHTML=suspectBoard();document.getElementById("evidenceList").innerHTML=state.evidence.length?state.evidence.map(e=>"<p>🔎 "+e+"</p>").join(""):"尚未取得證物";document.getElementById("progressText").textContent=state.done.length+" / 5 關";document.getElementById("progressBar").style.width=state.done.length*20+"%";document.getElementById("correctCount").textContent=state.correct;document.getElementById("wrongCount").textContent=Object.keys(state.wrong).length;document.getElementById("starCount").textContent=state.stars+" ⭐";document.getElementById("badgeCount").textContent=state.badges.length+" 🏅";document.getElementById("badges").innerHTML=state.badges.length?"🏅 我的徽章： "+state.badges.map(x=>"<span class='badge'>"+x+"</span>").join(""):"🎁 完成關卡收集徽章！"}
function menu(){nav.innerHTML=lessons.map((l,i)=>"<button class='navbtn "+(i===current?"active":"")+"' data-i='"+i+"' "+(i>0&&!state.done.includes(i-1)?"disabled":"")+">"+(state.done.includes(i)?"🏆 ":"🗝️ ")+l.title+"<small>"+l.sub+"</small></button>").join("");nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(!b.disabled){current=+b.dataset.i;render()}})}
function render(){menu();let l=lessons[current];activeQuestions=makeQuestions(current);content.innerHTML="<span class='pill'>🕵️ 案件 "+(current+1)+"｜現場調查中</span><div class='case-stamp'>CASE FILE 0"+(current+1)+"</div><div class='case-story'><p>"+l.story+"</p></div>"+l.body+"<h3>🔎 案件推理測驗</h3><p>每次隨機抽出 5 題，題目與選項順序都會變化；提交後看解析、領星星！</p><div id='quiz'></div><div class='actions'><button class='primary' id='finish'>提交推理・取得線索</button><button class='secondary' id='next'>下一關 →</button></div><div id='result'></div>";document.getElementById("quiz").innerHTML=activeQuestions.map((q,i)=>"<div class='question'><b>"+(i+1)+". "+q[0]+"</b>"+q[1].map((o,j)=>"<label class='option'><input type='radio' name='q"+i+"' value='"+j+"'> "+String.fromCharCode(65+j)+". "+o+"</label>").join("")+"<div id='f"+i+"'></div></div>").join("");document.getElementById("finish").onclick=grade;document.getElementById("next").onclick=()=>{if(!state.done.includes(current)){document.getElementById("result").innerHTML="<p class='feedback bad'>先完成本關挑戰，才能前往下一關喔！</p>";return}if(current<4){current++;render()}else{summary()}}}
function grade(){
 const picks=activeQuestions.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked"));
 if(picks.some(p=>!p)){activeQuestions.forEach((q,i)=>{if(!picks[i])document.getElementById("f"+i).innerHTML="<div class='feedback bad'>請先回答這一題</div>"});document.getElementById("result").innerHTML="<p class='feedback bad'>請完成全部 5 題再提交。</p>";return}
 let score=0;
 activeQuestions.forEach((q,i)=>{const p=picks[i],f=document.getElementById("f"+i);if(+p.value===q[2]){score++;state.correct++;delete state.wrong[current+"-"+i];f.innerHTML="<div class='feedback good'>推理正確！"+q[3]+"</div>"}else{state.wrong[current+"-"+i]={question:q[0],correct:q[1][q[2]],why:q[3]};f.innerHTML="<div class='feedback bad'>正確答案："+q[1][q[2]]+"。"+q[3]+"</div>"}});
 const firstClear=!state.rewarded.includes(current);
 if(!state.done.includes(current))state.done.push(current);
 if(firstClear){state.rewarded.push(current);state.evidence.push(evidenceClues[current]);}
 const stars=score===5?3:score>=4?2:1;
 if(firstClear)state.stars+=stars;
 const badge=["🌱 因數小新手","🧩 公因數探索家","🚀 倍數小超人","🕵️ 應用解題王","👑 數學闖關冠軍"][current];
 if(firstClear&&!state.badges.includes(badge))state.badges.push(badge);
 document.getElementById("result").innerHTML="<p class='score'>"+(firstClear?"獲得 "+stars+" 顆星星 ⭐":"再次挑戰完成！")+"</p><p>答對 "+score+"/5 題！"+(score===5?"完美推理！":"完成挑戰！")+"</p>"+(firstClear?"<p class='callout'>🏅 解鎖徽章："+badge+"<br>🧾 新證物："+evidenceClues[current]+"</p>":"<p class='callout'>這份證物已經收集過囉！本次新題目已完成。</p>")+(current===4?"<button class='primary' id='reveal'>🔦 公開最後推理！</button>":"");
 const rb=document.getElementById("reveal");if(rb)rb.onclick=summary;
 save();menu();
}
function summary(){
 if(state.done.length<5){document.getElementById("result").innerHTML="<p class='feedback bad'>先完成五份案件，才能公開最後推理！</p>";return}
 state.caseSolved=true;save();
 content.innerHTML="<span class='case-stamp'>FINAL DEDUCTION</span><h2>🎬 真相揭曉！獎盃失竊案結案</h2><div class='case-story'><p>真正移動獎盃的人是阿花小天使，校刊編輯！但他不是要偷走獎盃，而是想把獎盃放到活動中心的驚喜展台，準備在校慶當天揭幕。</p></div><h3>🧾 五件證物如何串起真相？</h3>"+state.evidence.map((e,i)=>"<div class='question'><b>"+e+"</b><p>"+["星星貼紙與校刊封面相同，線索指向校刊編輯。","金色緞帶來自校刊編輯桌上的佈置材料。","時間紀錄與阿花小天使前往活動中心前的準備時段吻合。","目擊者看到海報筒，與阿花小天使製作驚喜展台的工作相符。","字條說明他把獎盃移去展台，真相終於完整。"][i]+"</p></div>").join("")+"<h3>🕵️ 偵探的結案報告</h3><p class='callout'>傅貝貝與傅シロ都只是協助校慶準備。阿花小天使想製造驚喜，卻忘了先告訴老師，才讓大家誤以為獎盃失竊。這是一場烏龍事件！</p><p class='score'>⭐ "+state.stars+" 顆星星｜🏅 "+state.badges.length+" 枚徽章</p><button class='primary' id='back'>回到案件地圖</button>";
 document.getElementById("back").onclick=()=>{current=0;render()};
}

const semesterUnits=[
 "最大公因數與最小公倍數","分數除法","小數除法","比與比值",
