<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1d8"><title>數學闖關樂園</title>
<style>
:root{--ink:#493c68;--pink:#ff8fb1;--purple:#9279e8;--yellow:#ffcf68;--bg:#fff8ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#ffe8b8,transparent 25%),radial-gradient(circle at 90% 20%,#f1e4ff,transparent 25%),var(--bg);font-family:system-ui,"Noto Sans TC",sans-serif;color:var(--ink);line-height:1.7}header{padding:25px 16px;background:linear-gradient(120deg,#ffe2a7,#ffdce9,#e7ddff);border-bottom:6px solid white}.wrap{max-width:1000px;margin:auto;padding:0 16px}.top,.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(26px,5vw,40px);margin:14px 0 5px;color:#624bb0}.tag,.pill{background:#fff;border-radius:99px;padding:5px 12px}.progress{background:white;border-radius:20px;padding:13px;margin-top:18px;box-shadow:0 6px #d9c9ef}.bar{height:12px;background:#eee8fa;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#ffc45d,#ff8fb1,#9279e8);width:0}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;margin:22px auto}.panel,.content{background:white;border:2px solid #f4e6f1;border-radius:24px;padding:18px;box-shadow:0 7px #f0e2ed}.stat{background:#f8f4ff;border-radius:15px;padding:10px;flex:1;min-width:90px;text-align:center}.stat b{font-size:23px;display:block}nav{display:grid;gap:8px;margin-top:12px}.navbtn,button{font:inherit;cursor:pointer}.navbtn{background:#fff;border:2px solid #eee5f5;border-radius:14px;padding:10px;text-align:left;color:var(--ink)}.navbtn.active{background:#f1eaff;border-color:#b9a7ef;font-weight:bold}.navbtn:disabled{opacity:.45;cursor:not-allowed}.navbtn small{display:block}.pill{display:inline-block;background:#edf4ff;color:#4965a8;font-size:13px}h2{margin:8px 0}h3{margin:18px 0 8px}.callout{background:#fff5d9;border-left:5px solid var(--yellow);padding:12px;border-radius:13px;margin:12px 0}.example,.question{background:#fffdfd;border:2px solid #f1e5f0;border-radius:16px;padding:14px;margin:12px 0}.option{display:block;padding:8px;border:1px solid #eadff0;border-radius:12px;margin:7px 0}.primary{border:0;background:linear-gradient(120deg,var(--purple),var(--pink));color:white;border-radius:14px;padding:10px 18px;font-weight:bold;box-shadow:0 4px #d9c5ee}.secondary{background:white;border:2px solid #eadcf0;border-radius:12px;padding:8px 12px;color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.feedback{padding:10px;border-radius:12px}.good{background:#eaf7ef;color:#226b49}.bad{background:#fff0f0;color:#9e3d43}.score{font-size:27px;font-weight:bold;color:#7058c5}.footer{text-align:center;font-size:12px;color:#777;margin:25px}.badge{display:inline-block;background:#fff0bd;border-radius:14px;padding:6px 10px;margin:3px}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel,.content{padding:14px}}
</style></head><body>
<header><div class="wrap"><div class="top"><strong>🦄⭐ 數學闖關樂園</strong><span class="tag">國小六年級・數學冒險</span></div><h1>最大公因數與最小公倍數</h1><p>🎮 完成任務賺星星、解鎖徽章，成為數學小高手！</p><div class="progress"><div class="top"><b>🏁 闖關進度</b><span id="progressText">0 / 5 關</span></div><div class="bar"><span id="progressBar"></span></div></div></div></header>
<main class="wrap layout"><aside class="panel"><h3>🗺️ 闖關地圖</h3><div class="stats"><div class="stat"><b id="starCount">0 ⭐</b>星星</div><div class="stat"><b id="badgeCount">0 🏅</b>徽章</div></div><div id="badges" class="callout">🎁 完成關卡收集徽章！</div><nav id="nav"></nav><hr><h3>📒 學習紀錄</h3><div class="stats"><div class="stat"><b id="correctCount">0</b>答對題數</div><div class="stat"><b id="wrongCount">0</b>待訂正</div></div><div class="actions"><button class="secondary" id="reviewWrong">查看錯題</button><button class="secondary" id="reset">重設紀錄</button></div></aside><section class="content" id="content" aria-live="polite"></section></main><p class="footer">學習紀錄保存在目前裝置的瀏覽器中；清除瀏覽資料可能會讓紀錄消失。</p>
<script>
const lessons=[
{title:"第 1 關｜觀念村",sub:"因數、倍數、公因數、公倍數",body:"<h2>🌱 認識因數與倍數</h2><p><b>因數</b>：可以整除某個數的數。<br><b>倍數</b>：某個數乘以整數得到的數。</p><div class='example'><b>12 的因數：</b>1、2、3、4、6、12<br><b>18 的因數：</b>1、2、3、6、9、18<br><b>公因數：</b>1、2、3、6 → 最大公因數是 6<br><br><b>12 的倍數：</b>12、24、36……<br><b>18 的倍數：</b>18、36、54……<br><b>公倍數：</b>36、72…… → 最小公倍數是 36</div><div class='callout'>🪄 小口訣：因數是「除得盡」；倍數是「乘出來」。</div>",qs:[["24 的所有因數有哪些？",["1、2、3、4、6、8、12、24","1、2、4、6、12","2、3、4、6、8"],0,"24 可以被 1、2、3、4、6、8、12、24 整除。"],["8 的前 5 個正倍數是哪一組？",["8、16、24、32、40","8、16、24、32、40、48","1、2、4、8、16"],0,"8×1 到 8×5，依序是 8、16、24、32、40。"],["12 和 20 的公因數有哪些？",["1、2、4","1、2、3、4","2、4、6"],0,"12 和 20 都能被 1、2、4 整除。"]]},
{title:"第 2 關｜公因數森林",sub:"挑戰最大公因數",body:"<h2>🧩 最大公因數</h2><p>兩個或多個數的共同因數中，最大的一個就是最大公因數。</p><div class='callout'>看到「分成最多組」、「平均分配」、「每段一樣長且最長」，通常要想到最大公因數。</div><div class='example'><b>例：24 和 36</b><pre>2 │ 24　36<br>2 │ 12　18<br>3 │  6　 9<br>  │  2　 3</pre>共同除數相乘：2×2×3＝12，所以最大公因數是 12。</div>",qs:[["18 和 30 的最大公因數是多少？",["3","6","9"],1,"共同因數有 1、2、3、6，最大的是 6。"],["28 和 42 的最大公因數是多少？",["7","14","21"],1,"28=2×2×7；42=2×3×7，共同質因數相乘為 14。"],["24 顆糖和 32 顆餅乾平均分成最多份，最多幾份？",["4","8","12"],1,"平均分成最多份，求最大公因數 8。"]]},
{title:"第 3 關｜倍數城堡",sub:"挑戰最小公倍數",body:"<h2>🚀 最小公倍數</h2><p>兩個或多個數的共同倍數中，最小的正整數就是最小公倍數。</p><div class='callout'>看到「同時」、「再次」、「週期」、「多久後又一起」，通常要想到最小公倍數。</div><div class='example'><b>例：12 和 18</b><pre>2 │ 12　18<br>3 │  6　 9<br>  │  2　 3</pre>把左邊除數和最後一列相乘：2×3×2×3＝36。</div>",qs:[["6 和 8 的最小公倍數是多少？",["12","24","48"],1,"共同倍數中最小的是 24。"],["9 和 12 的最小公倍數是多少？",["18","24","36"],2,"2×2×3×3＝36。"],["甲每 4 天澆花，乙每 6 天澆花，幾天後再次同一天澆花？",["10 天","12 天","24 天"],1,"週期重合，求最小公倍數 12 天。"]]},
{title:"第 4 關｜生活應用島",sub:"判斷使用哪一種方法",body:"<h2>🕵️ 看懂題目再出招</h2><div class='callout'><b>最大公因數：</b>分組、平分、剪成相同的最長長度。<br><b>最小公倍數：</b>週期、同時、再次相遇或重合。</div><h3>解題三步驟</h3><ol><li>圈出題目問什麼。</li><li>判斷是「分組」還是「週期重合」。</li><li>列式計算，寫上單位與答句。</li></ol>",qs:[["30 顆蘋果和 45 顆橘子分成內容相同且不剩的最多禮盒數，應求？",["最大公因數","最小公倍數"],0,"平均分組，求最大公因數。"],["甲車每 8 分鐘、乙車每 12 分鐘發車，同時發車後多久再次同時？",["最大公因數","最小公倍數"],1,"週期重合，求最小公倍數 24 分鐘。"],["48 公分和 60 公分緞帶剪成相同且最長的小段，每段幾公分？",["6 公分","12 公分","24 公分"],1,"等長切割且要最長，求最大公因數 12 公分。"]]},
{title:"第 5 關｜終極挑戰",sub:"混合題型總複習",body:"<h2>👑 終極挑戰！</h2><p>這一關不提示使用哪一種方法。先讀懂題目，再自己決定解法！</p><div class='callout'>考試檢查：我能分辨因數與倍數、使用短除法、判斷最大公因數或最小公倍數，並寫上單位。</div>",qs:[["36 和 48 的最大公因數是多少？",["6","12","18"],1,"最大公因數是 12。"],["10 和 15 的最小公倍數是多少？",["30","45","150"],0,"最小公倍數是 30。"],["紅燈每 6 秒亮一次，綠燈每 9 秒亮一次，同時亮後幾秒再次同時亮？",["3 秒","18 秒","54 秒"],1,"週期重合，求最小公倍數 18 秒。"],["40 顆糖和 56 顆餅乾平均分成最多份，最多幾份？",["4 份","8 份","16 份"],1,"平均分成最多份，求最大公因數 8。"],["16 和 24 的公因數中，最大的是多少？",["4","8","12"],1,"最大公因數是 8。"]]}
];
let state=JSON.parse(localStorage.getItem("mathQuest")||'{"done":[],"correct":0,"wrong":{},"stars":0,"badges":[],"rewarded":[]}');state.stars=state.stars||0;state.badges=state.badges||[];state.rewarded=state.rewarded||[];let current=0;
const nav=document.getElementById("nav"),content=document.getElementById("content");
function save(){localStorage.setItem("mathQuest",JSON.stringify(state));stats()}
function stats(){document.getElementById("progressText").textContent=state.done.length+" / 5 關";document.getElementById("progressBar").style.width=state.done.length*20+"%";document.getElementById("correctCount").textContent=state.correct;document.getElementById("wrongCount").textContent=Object.keys(state.wrong).length;document.getElementById("starCount").textContent=state.stars+" ⭐";document.getElementById("badgeCount").textContent=state.badges.length+" 🏅";document.getElementById("badges").innerHTML=state.badges.length?"🏅 我的徽章： "+state.badges.map(x=>"<span class='badge'>"+x+"</span>").join(""):"🎁 完成關卡收集徽章！"}
function menu(){nav.innerHTML=lessons.map((l,i)=>"<button class='navbtn "+(i===current?"active":"")+"' data-i='"+i+"' "+(i>0&&!state.done.includes(i-1)?"disabled":"")+">"+(state.done.includes(i)?"🏆 ":"🗝️ ")+l.title+"<small>"+l.sub+"</small></button>").join("");nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(!b.disabled){current=+b.dataset.i;render()}})}
function render(){menu();let l=lessons[current];content.innerHTML="<span class='pill'>🎯 第 "+(current+1)+" 關冒險任務</span>"+l.body+"<h3>📝 闖關小測驗</h3><p>每題選一個答案，提交後看解析、領星星！</p><div id='quiz'></div><div class='actions'><button class='primary' id='finish'>提交答案・領獎勵</button><button class='secondary' id='next'>下一關 →</button></div><div id='result'></div>";document.getElementById("quiz").innerHTML=l.qs.map((q,i)=>"<div class='question'><b>"+(i+1)+". "+q[0]+"</b>"+q[1].map((o,j)=>"<label class='option'><input type='radio' name='q"+i+"' value='"+j+"'> "+String.fromCharCode(65+j)+". "+o+"</label>").join("")+"<div id='f"+i+"'></div></div>").join("");document.getElementById("finish").onclick=grade;document.getElementById("next").onclick=()=>{if(!state.done.includes(current)){document.getElementById("result").innerHTML="<p class='feedback bad'>先完成本關挑戰，才能前往下一關喔！</p>";return}if(current<4){current++;render()}else{summary()}}}
function grade(){if(state.rewarded.includes(current)){document.getElementById("result").innerHTML="<p class='callout'>本關獎勵已領取！繼續下一關吧！</p>";return}let l=lessons[current],score=0,answered=0;l.qs.forEach((q,i)=>{let p=document.querySelector("input[name=q"+i+"]:checked"),f=document.getElementById("f"+i);if(!p){f.innerHTML="<div class='feedback bad'>尚未作答</div>";return}answered++;if(+p.value===q[2]){score++;state.correct++;delete state.wrong[current+"-"+i];f.innerHTML="<div class='feedback good'>答對了！"+q[3]+"</div>"}else{state.wrong[current+"-"+i]={question:q[0],correct:q[1][q[2]],why:q[3]};f.innerHTML="<div class='feedback bad'>正確答案："+q[1][q[2]]+"。"+q[3]+"</div>"}});if(answered===l.qs.length){state.done.push(current);state.rewarded.push(current);let stars=score===l.qs.length?3:score>=Math.ceil(l.qs.length*.7)?2:1;state.stars+=stars;let badge=["🌱 因數小新手","🧩 公因數探索家","🚀 倍數小超人","🕵️ 應用解題王","👑 數學闖關冠軍"][current];state.badges.push(badge);document.getElementById("result").innerHTML="<p class='score'>獲得 "+stars+" 顆星星 ⭐</p><p>答對 "+score+"/"+l.qs.length+" 題！"+(score===l.qs.length?"完美通關！":"完成挑戰！")+"</p><p class='callout'>🏅 解鎖徽章："+badge+"</p>"}else{document.getElementById("result").innerHTML="<p class='feedback bad'>請完成所有題目，再提交一次。</p>"}save();menu()}
function summary(){content.innerHTML="<h2>🎉 五關冒險完成！</h2><p class='score'>⭐ "+state.stars+" 顆星星</p><p>🏅 "+state.badges.join("、")+"</p><p>你已成為數學闖關小勇士！答對 "+state.correct+" 題，還有 "+Object.keys(state.wrong).length+" 題可以訂正。</p><button class='primary' id='back'>回到闖關地圖</button>";document.getElementById("back").onclick=()=>{current=0;render()}}
document.getElementById("reviewWrong").onclick=()=>{let a=Object.values(state.wrong);content.innerHTML="<h2>📒 我的錯題本</h2>"+(a.length?a.map((x,i)=>"<div class='question'><b>"+(i+1)+". "+x.question+"</b><p class='good'>正確答案："+x.correct+"</p><p>"+x.why+"</p></div>").join(""):"<p class='callout'>目前沒有待訂正錯題，真棒！</p>")+"<button class='secondary' id='return'>返回課程</button>";document.getElementById("return").onclick=render};
document.getElementById("reset").onclick=()=>{if(confirm("確定清除所有星星、徽章與紀錄？")){state={done:[],correct:0,wrong:{},stars:0,badges:[],rewarded:[]};save();current=0;render()}};stats();render();
</script></body></html>
